<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gemini Image Generator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#fff;
    text-align:center;
    padding:20px;
}
.container{
    max-width:800px;
    margin:auto;
}
input,textarea,button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:8px;
    border:none;
}
textarea{
    height:120px;
}
button{
    background:#4f46e5;
    color:white;
    cursor:pointer;
}
button:hover{
    opacity:.9;
}
img{
    max-width:100%;
    margin-top:20px;
    border-radius:10px;
}
.loading{
    margin-top:20px;
}
</style>

</head>
<body>

<div class="container">

<h1>Gemini AI Image Generator</h1>

<input type="file" id="imageInput" accept="image/*">

<textarea
id="prompt"
placeholder="Describe what you want..."
></textarea>

<button onclick="generateImage()">
Generate Image
</button>

<div id="result"></div>

</div>

<script>

const API_KEY = "AQ.Ab8RN6LB2FX9tisRWqUfcdUDq-_l28cheqbcPi_xhuPOdFCa2A";

async function fileToBase64(file){
    return new Promise((resolve,reject)=>{
        const reader = new FileReader();

        reader.onload = ()=>{
            resolve(reader.result.split(",")[1]);
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}

async function generateImage(){

    const file =
        document.getElementById("imageInput").files[0];

    if(!file){
        alert("Please select image");
        return;
    }

    const prompt =
        document.getElementById("prompt").value ||
        "Create a similar image";

    document.getElementById("result").innerHTML =
        "<div class='loading'>Generating...</div>";

    try{

        const base64 =
            await fileToBase64(file);

        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${API_KEY}`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    contents:[
                        {
                            parts:[
                                {
                                    text:prompt
                                },
                                {
                                    inlineData:{
                                        mimeType:file.type,
                                        data:base64
                                    }
                                }
                            ]
                        }
                    ],
                    generationConfig:{
                        responseModalities:["IMAGE"]
                    }
                })
            }
        );

        const data =
            await response.json();

        console.log(data);

        const generated =
            data?.candidates?.[0]
            ?.content?.parts
            ?.find(p=>p.inlineData);

        if(!generated){
            document.getElementById("result").innerHTML =
            "<pre>"+JSON.stringify(data,null,2)+"</pre>";
            return;
        }

        document.getElementById("result").innerHTML =
        `
        <img src="data:image/png;base64,${generated.inlineData.data}">
        `;

    }
    catch(err){

        console.error(err);

        document.getElementById("result").innerHTML =
        `<pre>${err.message}</pre>`;

    }
}

</script>

</body>
</html>
