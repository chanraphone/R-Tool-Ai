<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Cloner Pro</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
}
</style>
</head>

<body class="p-6">

<div class="max-w-xl mx-auto bg-slate-900 p-5 rounded-xl">

<h1 class="text-xl font-bold mb-4">AI Image Cloner</h1>

<!-- 🔑 API KEY SECTION (NEW) -->
<div class="mb-4 p-3 bg-slate-800 rounded-lg border border-slate-700">

    <label class="text-sm font-semibold">🔑 OpenRouter / Gemini API Key</label>

    <input 
        id="apiKey" 
        type="password"
        class="w-full mt-2 p-2 text-black rounded"
        placeholder="Enter your API Key here"
    >

    <div class="flex items-center mt-2 gap-2">
        <input type="checkbox" id="showKey" onchange="toggleKey()">
        <label class="text-xs text-slate-300">Show API Key</label>
    </div>

    <button onclick="saveKey()" class="mt-2 w-full bg-green-600 p-2 rounded text-sm">
        Save Key (LocalStorage)
    </button>

</div>

<!-- Upload -->
<input type="file" id="fileInput" accept="image/*" class="mb-3">

<!-- Prompt -->
<textarea id="prompt" class="w-full p-2 text-black rounded mb-3" rows="3" placeholder="Prompt..."></textarea>

<!-- Button -->
<button onclick="generate()" class="w-full bg-blue-600 p-2 rounded">
Generate Image
</button>

<!-- Output -->
<div id="result" class="mt-4 space-y-2"></div>

</div>

<script>

let base64Image = "";

// Load saved key
window.onload = function(){
    const saved = localStorage.getItem("apiKey");
    if(saved){
        document.getElementById("apiKey").value = saved;
    }
};

// Toggle show/hide API key
function toggleKey(){
    const input = document.getElementById("apiKey");
    input.type = input.type === "password" ? "text" : "password";
}

// Save API key
function saveKey(){
    const key = document.getElementById("apiKey").value;
    localStorage.setItem("apiKey", key);
    alert("API Key saved!");
}

// Convert image to base64
document.getElementById("fileInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(){
        base64Image = reader.result.split(",")[1];
    };

    reader.readAsDataURL(file);
});

function getApiKey(){
    return document.getElementById("apiKey").value.trim();
}

// Generate
async function generate(){

    const apiKey = getApiKey();
    const prompt = document.getElementById("prompt").value;

    if(!apiKey){
        alert("Please enter API Key");
        return;
    }

    if(!base64Image){
        alert("Please upload image");
        return;
    }

    document.getElementById("result").innerHTML = "Loading...";

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`;

    const payload = {
        contents: [{
            parts: [
                { text: prompt || "Create a variation of this image" },
                {
                    inlineData: {
                        mimeType: "image/png",
                        data: base64Image
                    }
                }
            ]
        }],
        generationConfig: {
            responseModalities: ["TEXT", "IMAGE"]
        }
    };

    try {
        const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        const img = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

        if(!img){
            document.getElementById("result").innerHTML = "No image returned";
            return;
        }

        const imgSrc = "data:image/png;base64," + img;

        document.getElementById("result").innerHTML = `
            <img src="${imgSrc}" class="rounded w-full">
            <a href="${imgSrc}" download="image.png" class="block mt-2 text-center bg-green-600 p-2 rounded">
                Download Image
            </a>
        `;

    } catch(err){
        document.getElementById("result").innerHTML = "Error: " + err.message;
    }
}

</script>

</body>
</html>
